services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  keycloak:
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
      - "${KEYCLOAK_MGMT_HOST_PORT:-9000}:9000"

  rabbitmq:
    # Management UI localhost-only — not public.
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_HOST_PORT:-15672}:15672"

  api:
    ports:
      - "${API_HOST_PORT:-8200}:8000"
      # Do NOT publish 8001 (internal metrics) to the host.
    volumes:
      - ./backend/src:/app/src:ro
    command: ["uvicorn", "stockpilot.bootstrap.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  prometheus:
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    ports:
      - "${GRAFANA_HOST_PORT:-8300}:3000"

  alertmanager:
    ports:
      - "${ALERTMANAGER_HOST_PORT:-8301}:9093"

  relay:
    volumes:
      - ./backend/src:/app/src:ro

  worker:
    volumes:
      - ./backend/src:/app/src:ro

  scheduler:
    volumes:
      - ./backend/src:/app/src:ro

  frontend-dev:
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8200}

  backend-checks:
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./docs:/docs:ro
      - ./compose.prod.yaml:/compose.prod.yaml:ro
      - ./infra/caddy:/caddy:ro
    environment:
      STOCKPILOT_SAMPLE_DATA_PATH: /docs/stockpilot-sample-data.md
      STOCKPILOT_COMPOSE_PROD_PATH: /compose.prod.yaml
      STOCKPILOT_CADDY_PROD_PATH: /caddy/Caddyfile
      STOCKPILOT_CADDY_LOCAL_PATH: /caddy/Caddyfile.local

  openapi-export:
    volumes:
      - ./backend/src:/app/src:ro
      - ./frontend/.openapi-tmp:/out

  frontend-checks:
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/openapi.json:/app/openapi.json:ro
      - ./frontend/scripts:/app/scripts:ro
      - ./frontend/.openapi-tmp:/app/.openapi-tmp:ro

volumes:
  frontend_node_modules:
