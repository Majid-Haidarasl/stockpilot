services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"

  keycloak:
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
      - "${KEYCLOAK_MGMT_HOST_PORT:-9000}:9000"

  api:
    ports:
      - "${API_HOST_PORT:-8200}:8000"
    volumes:
      - ./backend/src:/app/src:ro
    command: ["uvicorn", "stockpilot.bootstrap.app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend-dev:
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8200}

  backend-checks:
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./docs:/docs:ro
    environment:
      STOCKPILOT_SAMPLE_DATA_PATH: /docs/stockpilot-sample-data.md

  frontend-checks:
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro

volumes:
  frontend_node_modules:
