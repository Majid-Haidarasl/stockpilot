name: stockpilot

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:-postgres}
      STOCKPILOT_MIGRATOR_PASSWORD: ${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}
      STOCKPILOT_APP_PASSWORD: ${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockpilot

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://stockpilot_migrator:${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}@postgres:5432/stockpilot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0001_schemas
      STOCKPILOT_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - stockpilot
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend-dev:
    build:
      context: ./frontend
      target: dev
    networks:
      - stockpilot

  backend-checks:
    profiles: ["test"]
    build:
      context: ./backend
      target: checks
    environment:
      STOCKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://stockpilot_migrator:${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0001_schemas
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot

  frontend-checks:
    profiles: ["test"]
    build:
      context: ./frontend
      target: checks
    networks:
      - stockpilot

networks:
  stockpilot:
    driver: bridge

volumes:
  postgres_data:
