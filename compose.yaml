name: stockpilot

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:-postgres}
      STOCKPILOT_MIGRATOR_PASSWORD: ${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}
      STOCKPILOT_APP_PASSWORD: ${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}
      STOCKPILOT_RELAY_PASSWORD: ${STOCKPILOT_RELAY_PASSWORD:-relay_dev_change_me}
      STOCKPILOT_METRICS_PASSWORD: ${STOCKPILOT_METRICS_PASSWORD:-metrics_dev_change_me}
      STOCKPILOT_BACKUP_PASSWORD: ${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stockpilot

  rabbitmq:
    # Pin verified at Phase 5.1; digest recorded in docs/architecture/versions.md
    image: rabbitmq:4.4.0-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stockpilot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_dev_change_me}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - stockpilot

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_change_me}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/stockpilot:/opt/keycloak/themes/stockpilot:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Keycloak 26 serves the app on 8080; management health is on 9000 when enabled.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - stockpilot

  migrate:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://stockpilot_migrator:${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}@postgres:5432/stockpilot
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot
    restart: "no"

  ops:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://stockpilot_migrator:${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}@postgres:5432/stockpilot
      # Runtime role for commercial writes (e.g. import-product-images). Bootstrap/seed still use migrator URL.
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      # Superuser URL for ensure-db-roles ONLY — never pass to api/relay/worker/migrate/checks.
      STOCKPILOT_ADMIN_DATABASE_URL: ${STOCKPILOT_ADMIN_DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/postgres}
      STOCKPILOT_RELAY_PASSWORD: ${STOCKPILOT_RELAY_PASSWORD:-relay_dev_change_me}
      STOCKPILOT_METRICS_PASSWORD: ${STOCKPILOT_METRICS_PASSWORD:-metrics_dev_change_me}
      STOCKPILOT_BACKUP_PASSWORD: ${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}
      # Broker for ops replay-failed-jobs only (never on api).
      STOCKPILOT_CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockpilot}:${RABBITMQ_DEFAULT_PASS:-rabbit_dev_change_me}@rabbitmq:5672//
      STOCKPILOT_MEDIA_DIR: /var/lib/stockpilot/media
      STOCKPILOT_OIDC_ISSUER: ${STOCKPILOT_OIDC_ISSUER:-http://localhost:8180/realms/stockpilot}
      STOCKPILOT_ENVIRONMENT: ${STOCKPILOT_ENVIRONMENT:-development}
      STOCKPILOT_SAMPLE_DATA_PATH: /docs/stockpilot-sample-data.md
    volumes:
      - ./docs:/docs:ro
      - stockpilot_media:/var/lib/stockpilot/media
    # Override command when running: bootstrap | seed-demo | balance-check | ensure-db-roles | import-product-images | queue-signals | replay-failed-jobs
    command: ["python", "-m", "stockpilot.bootstrap.ops", "bootstrap", "--environment", "development"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot
    restart: "no"

  api:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
      STOCKPILOT_ENVIRONMENT: development
      STOCKPILOT_OIDC_ISSUER: ${STOCKPILOT_OIDC_ISSUER:-http://localhost:8180/realms/stockpilot}
      STOCKPILOT_OIDC_METADATA_URL: http://keycloak:8080/realms/stockpilot/.well-known/openid-configuration
      STOCKPILOT_OIDC_CLIENT_ID: stockpilot-api
      STOCKPILOT_OIDC_CLIENT_SECRET: ${STOCKPILOT_OIDC_CLIENT_SECRET:-stockpilot-dev-client-secret-change-me}
      STOCKPILOT_OIDC_REDIRECT_URI: ${STOCKPILOT_OIDC_REDIRECT_URI:-http://localhost:8200/auth/callback}
      STOCKPILOT_OIDC_ALLOWED_REDIRECT_URIS: ${STOCKPILOT_OIDC_ALLOWED_REDIRECT_URIS:-http://localhost:8200/auth/callback}
      STOCKPILOT_COOKIE_SECURE: "false"
      STOCKPILOT_CORS_ORIGINS: ${STOCKPILOT_CORS_ORIGINS:-http://localhost:5173}
      STOCKPILOT_FRONTEND_DEFAULT_URL: ${STOCKPILOT_FRONTEND_DEFAULT_URL:-http://localhost:5173}
      STOCKPILOT_APP_PUBLIC_ORIGIN: ${STOCKPILOT_APP_PUBLIC_ORIGIN:-http://localhost:8200}
      STOCKPILOT_TOKEN_ENCRYPTION_KEY: ${STOCKPILOT_TOKEN_ENCRYPTION_KEY:-dev-only-fernet-key-32bytes-long!!}
      STOCKPILOT_MEDIA_DIR: /var/lib/stockpilot/media
      STOCKPILOT_API_METRICS_ENABLED: "true"
      STOCKPILOT_API_METRICS_PORT: "8001"
    expose:
      - "8001"
    volumes:
      - stockpilot_media:/var/lib/stockpilot/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    networks:
      - stockpilot
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\""]
      interval: 5s
      timeout: 5s
      retries: 10

  relay:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_relay:${STOCKPILOT_RELAY_PASSWORD:-relay_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockpilot}:${RABBITMQ_DEFAULT_PASS:-rabbit_dev_change_me}@rabbitmq:5672//
      STOCKPILOT_OUTBOX_BATCH_SIZE: ${STOCKPILOT_OUTBOX_BATCH_SIZE:-50}
      STOCKPILOT_OUTBOX_LEASE_SECONDS: ${STOCKPILOT_OUTBOX_LEASE_SECONDS:-30}
      STOCKPILOT_RELAY_POLL_SECONDS: ${STOCKPILOT_RELAY_POLL_SECONDS:-1}
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
    command: ["python", "-m", "stockpilot.bootstrap.relay"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpilot

  worker:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockpilot}:${RABBITMQ_DEFAULT_PASS:-rabbit_dev_change_me}@rabbitmq:5672//
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
      STOCKPILOT_WORKER_IDLE_HEARTBEAT_SECONDS: ${STOCKPILOT_WORKER_IDLE_HEARTBEAT_SECONDS:-60}
    command:
      [
        "celery",
        "-A",
        "stockpilot.bootstrap.celery_app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
        "--without-gossip",
        "--without-mingle",
        "--without-heartbeat",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpilot

  scheduler:
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
      STOCKPILOT_SCHEDULER_INTERVAL_SECONDS: ${STOCKPILOT_SCHEDULER_INTERVAL_SECONDS:-60}
      STOCKPILOT_SCHEDULER_HEARTBEAT_STALE_SECONDS: ${STOCKPILOT_SCHEDULER_HEARTBEAT_STALE_SECONDS:-180}
    command: ["python", "-m", "stockpilot.bootstrap.scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - stockpilot
    healthcheck:
      test: ["CMD", "python", "-m", "stockpilot.bootstrap.scheduler_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  frontend-dev:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8200}
    networks:
      - stockpilot

  backend-checks:
    profiles: ["test"]
    build:
      context: ./backend
      target: checks
    environment:
      STOCKPILOT_TEST_ADMIN_DATABASE_URL: postgresql+psycopg://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD:-postgres}@postgres:5432/postgres
      STOCKPILOT_TEST_DATABASE_NAME: stockpilot_test
      STOCKPILOT_MIGRATION_DATABASE_URL: postgresql+psycopg://stockpilot_migrator:${STOCKPILOT_MIGRATOR_PASSWORD:-migrator_dev_change_me}@postgres:5432/stockpilot_test
      STOCKPILOT_DATABASE_URL: postgresql+psycopg://stockpilot_app:${STOCKPILOT_APP_PASSWORD:-app_dev_change_me}@postgres:5432/stockpilot_test
      STOCKPILOT_RELAY_DATABASE_URL: postgresql+psycopg://stockpilot_relay:${STOCKPILOT_RELAY_PASSWORD:-relay_dev_change_me}@postgres:5432/stockpilot_test
      STOCKPILOT_RELAY_PASSWORD: ${STOCKPILOT_RELAY_PASSWORD:-relay_dev_change_me}
      STOCKPILOT_METRICS_PASSWORD: ${STOCKPILOT_METRICS_PASSWORD:-metrics_dev_change_me}
      STOCKPILOT_METRICS_DATABASE_URL: postgresql+psycopg://stockpilot_metrics:${STOCKPILOT_METRICS_PASSWORD:-metrics_dev_change_me}@postgres:5432/stockpilot_test
      STOCKPILOT_BACKUP_PASSWORD: ${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}
      STOCKPILOT_BACKUP_DATABASE_URL: postgresql+psycopg://stockpilot_backup:${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}@postgres:5432/stockpilot_test
      # Isolated vhost so a live compose worker on "/" cannot steal test messages.
      STOCKPILOT_CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockpilot}:${RABBITMQ_DEFAULT_PASS:-rabbit_dev_change_me}@rabbitmq:5672/stockpilot_test
      STOCKPILOT_TEST_RABBITMQ_VHOST: stockpilot_test
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
      STOCKPILOT_API_METRICS_ENABLED: "false"
      STOCKPILOT_MEDIA_DIR: /tmp/stockpilot-media-test
      STOCKPILOT_COMPOSE_PATH: /compose.yaml
    volumes:
      - ./compose.yaml:/compose.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpilot

  openapi-export:
    profiles: ["test"]
    build:
      context: ./backend
      target: runtime
    command:
      [
        "python",
        "-m",
        "stockpilot.bootstrap.export_openapi",
        "/out/openapi.live.json",
      ]
    volumes:
      - ./frontend/.openapi-tmp:/out
    networks:
      - stockpilot
    restart: "no"

  frontend-checks:
    profiles: ["test"]
    build:
      context: ./frontend
      target: checks
    environment:
      OPENAPI_LIVE_PATH: /app/.openapi-tmp/openapi.live.json
    volumes:
      - ./frontend/.openapi-tmp:/app/.openapi-tmp:ro
    depends_on:
      openapi-export:
        condition: service_completed_successfully
    networks:
      - stockpilot

  ops-exporter:
    profiles: ["observability"]
    build:
      context: ./backend
      target: runtime
    environment:
      STOCKPILOT_METRICS_DATABASE_URL: postgresql+psycopg://stockpilot_metrics:${STOCKPILOT_METRICS_PASSWORD:-metrics_dev_change_me}@postgres:5432/stockpilot
      STOCKPILOT_OPS_EXPORTER_PORT: "9108"
      STOCKPILOT_OPS_EXPORTER_INTERVAL_SECONDS: "15"
      STOCKPILOT_EXPECTED_SCHEMA_REVISION: 0015_backup_heartbeat
    command: ["python", "-m", "stockpilot.bootstrap.ops_exporter"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - stockpilot
    expose:
      - "9108"
    restart: unless-stopped

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - ops-exporter
      - alertmanager
    networks:
      - stockpilot
    restart: unless-stopped

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - alert-sink
    networks:
      - stockpilot
    restart: unless-stopped

  alert-sink:
    profiles: ["observability"]
    image: python:3.13-slim
    command:
      [
        "python",
        "-u",
        "/app/alert-sink.py",
      ]
    volumes:
      - ./infra/alertmanager/alert-sink.py:/app/alert-sink.py:ro
    networks:
      - stockpilot
    expose:
      - "8080"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_dev_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - stockpilot
    restart: unless-stopped

  # Operational backup (profile backup). No Docker socket. No host ports.
  # Dumps as stockpilot_backup; restic encrypts to RESTIC_REPOSITORY.
  # restic_practice volume is PRACTICE ONLY (not off-host / not host-loss proof).
  backup:
    profiles: ["backup"]
    build:
      context: ./infra/backup
    user: "1000:1000"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: stockpilot_backup
      PGPASSWORD: ${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/var/lib/stockpilot/restic-practice}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-practice_restic_password_change_me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      STOCKPILOT_IMAGE_TAG: ${STOCKPILOT_IMAGE_TAG:-local}
      STOCKPILOT_MEDIA_DIR: /var/lib/stockpilot/media
      STOCKPILOT_BACKUP_SCRATCH: /var/lib/stockpilot/backup-scratch
      STOCKPILOT_BACKUP_CHECK_EVERY_N: ${STOCKPILOT_BACKUP_CHECK_EVERY_N:-14}
    volumes:
      - stockpilot_media:/var/lib/stockpilot/media:ro
      - backup_scratch:/var/lib/stockpilot/backup-scratch
      - restic_practice:/var/lib/stockpilot/restic-practice
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - stockpilot
    restart: "no"
    command: ["/usr/local/bin/backup.sh"]

  backup-scheduler:
    profiles: ["backup"]
    build:
      context: ./infra/backup
    user: "1000:1000"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: stockpilot_backup
      PGPASSWORD: ${STOCKPILOT_BACKUP_PASSWORD:-backup_dev_change_me}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/var/lib/stockpilot/restic-practice}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-practice_restic_password_change_me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      STOCKPILOT_IMAGE_TAG: ${STOCKPILOT_IMAGE_TAG:-local}
      STOCKPILOT_MEDIA_DIR: /var/lib/stockpilot/media
      STOCKPILOT_BACKUP_SCRATCH: /var/lib/stockpilot/backup-scratch
      STOCKPILOT_BACKUP_INTERVAL_SECONDS: ${STOCKPILOT_BACKUP_INTERVAL_SECONDS:-43200}
      STOCKPILOT_BACKUP_CHECK_EVERY_N: ${STOCKPILOT_BACKUP_CHECK_EVERY_N:-14}
    volumes:
      - stockpilot_media:/var/lib/stockpilot/media:ro
      - backup_scratch:/var/lib/stockpilot/backup-scratch
      - restic_practice:/var/lib/stockpilot/restic-practice
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - stockpilot
    restart: unless-stopped
    command: ["/usr/local/bin/scheduler.sh"]

  restore:
    profiles: ["backup"]
    build:
      context: ./infra/backup
    user: "1000:1000"
    environment:
      STOCKPILOT_RESTORE_CONFIRM: ${STOCKPILOT_RESTORE_CONFIRM:-}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_SUPERUSER:-postgres}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/var/lib/stockpilot/restic-practice}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-practice_restic_password_change_me}
      RESTIC_SNAPSHOT: ${RESTIC_SNAPSHOT:-latest}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      STOCKPILOT_MEDIA_DIR: /var/lib/stockpilot/media
      STOCKPILOT_BACKUP_SCRATCH: /var/lib/stockpilot/backup-scratch
    volumes:
      - stockpilot_media:/var/lib/stockpilot/media
      - backup_scratch:/var/lib/stockpilot/backup-scratch
      - restic_practice:/var/lib/stockpilot/restic-practice
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stockpilot
    restart: "no"
    command: ["/usr/local/bin/restore.sh"]

networks:
  stockpilot:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  stockpilot_media:
  backup_scratch:
  # PRACTICE ONLY — stands in for off-host restic; not a host-loss restore proof.
  restic_practice:
