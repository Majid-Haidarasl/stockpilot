# Single-node RabbitMQ for StockPilot v1.
# Management UI is not published on the public network (dev: localhost-only).
# Durable Celery exchange/queue are declared by the Relay publisher on connect.
loopback_users.guest = false
consumer_timeout = 1800000
# Celery workers disable remote control; keep permit off so misconfig fails loudly.
# (transient_nonexcl_queues remain denied — workers must not declare pidbox queues.)
